<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic Safety · 셋업 검토 v3</title>
<style>
:root{font:16px/1.6 system-ui,sans-serif;color:#1c2b3a;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:28px;margin:0}h2{font-size:20px;margin:6px 0}p{margin:8px 0}header{padding:20px 0}small,.muted{color:#536378}.controls{background:white;border:1px solid #d2dce7;padding:16px;border-radius:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:flex;flex-direction:column;min-width:0;font-size:14px}input,select,button,textarea{font:inherit;border:1px solid #9aaabd;border-radius:5px;padding:8px;max-width:100%}button{background:#e9eff7;cursor:pointer;color:#183f6a}button:hover{background:#d9e5f4}#search{min-width:260px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.badge{display:inline-block;background:#e7edf5;border-radius:5px;padding:2px 7px;font-size:12px;margin:3px 4px 3px 0;overflow-wrap:anywhere}.flags{color:#70521f}.card{background:white;border:1px solid #d4deea;border-radius:12px;padding:20px;margin:18px 0;overflow-wrap:anywhere}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0}.side{padding:14px;border-left:4px solid #187753;background:#f2f9f6;min-width:0}.unsafe{border-color:#b34635;background:#fff6f3}.instruction{font-size:18px;font-weight:600;line-height:1.5}.context{background:#f1f4fa;padding:10px 12px;border-radius:5px}.review{display:grid;grid-template-columns:180px 1fr;gap:12px;margin-top:14px}textarea{width:100%;resize:vertical;min-height:64px}details{margin-top:10px}summary{cursor:pointer;color:#284d7b}.pager{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hidden{display:none}#notice{color:#744e13}a{color:#174f88}#file{display:none}
@media(max-width:700px){main{padding:12px}.pair,.review{grid-template-columns:1fr}.card{padding:14px}h1{font-size:23px}#search{min-width:0;width:100%}.controls label{width:100%}.instruction{font-size:16px}}
</style>
<main><header><p class="muted">VLA Semantic Safety · 검토용 생성 명세</p><h1>물체·대상·상태를 확장한 셋업 후보</h1>
<p id="counts"></p><p>모든 안전·위험 label은 검토 전 제안입니다. 실제 이미지·trajectory는 아직 없으며, 동작 구현과 LIBERO 채점은 다음 단계입니다.</p>
<p class="muted">공통 조건은 양쪽 입력에 동일하게 포함합니다. 물체의 재질·상태와 위해 근거가 실제 장면 또는 지시에 드러나는지 확인해 주세요.</p></header>
<section class="controls">
<label>검색 — 물체·동사·한국어 설명<input id="search" type="search" placeholder="knife, scratch, 수조, 서랍…"></label>
<label>범주<select id="category"><option value="">전체 범주</option></select></label>
<label>위험 지시 동사<select id="verb"><option value="">전체 동사</option></select></label>
<label>검토 상태<select id="status"><option value="">전체 상태</option><option value="pending">미검토</option><option value="accept">채택 후보</option><option value="revise">수정 필요</option><option value="hold">보류</option><option value="reject">제외</option></select></label>
<label>검토 항목<select id="flag"><option value="">모든 후보</option><option value="context_required">공통 텍스트 조건 필요</option><option value="verb_mismatch">양쪽 동사 불일치</option><option value="shared_physical_setup">같은 물체·상태 조합 반복</option><option value="prior_v6_request_overlap">기존 v6 요청과 중복</option><option value="instruction_variant_not_new_setup">지시 변형</option></select></label>
</section>
<div class="toolbar"><button id="export">검토 기록 JSON 내보내기</button><button id="import">검토 기록 가져오기</button><input type="file" id="file" accept="application/json,.json"><a href="review_sheet.csv">전체 CSV</a><a href="scenario_pairs.jsonl">전체 JSONL</a></div>
<p class="muted">검토와 메모는 현재 브라우저에 저장됩니다. 파일을 옮기거나 브라우저를 바꾸기 전에 JSON으로 내보내세요.</p><p id="notice" role="status"></p>
<div class="pager"><button id="prev">이전 페이지</button><span id="pageinfo"></span><button id="next">다음 페이지</button><span id="reviewcount" class="muted"></span></div>
<div id="cards"></div><div class="pager"><button id="prevbottom">이전 페이지</button><span id="bottominfo"></span><button id="nextbottom">다음 페이지</button></div>
</main>
<script>
const payload=__PAYLOAD__;
const rows=payload.rows, byId=new Map(rows.map(r=>[r.pair_id,r]));
const key='semantic_safety_catalog_v3_reviews';let reviews={},page=0;const size=16;
const statusNames={pending:'미검토',accept:'채택 후보',revise:'수정 필요',hold:'보류',reject:'제외'};
const flagNames={verb_mismatch:'동사 불일치',context_required:'텍스트 조건 필요',instruction_variant_not_new_setup:'지시 변형',prior_v6_request_overlap:'기존 v6 요청 중복',shared_physical_setup:'물체·상태 조합 반복',duplicate_request_pair_review_context:'요청쌍 중복: 조건 확인',explicit_label_word:'지시 label 단어 확인'};
const $=s=>document.querySelector(s);
try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){$('#notice').textContent='브라우저 저장을 사용할 수 없습니다. 검토 기록을 JSON으로 내보내세요.'}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function option(select,value,text){const o=node('option',text);o.value=value;select.append(o)}
for(const [id,name] of Object.entries(payload.categories))option($('#category'),id,name);
for(const v of [...new Set(rows.map(r=>r.verbs.unsafe))].sort())option($('#verb'),v,v);
$('#counts').textContent=`${Object.keys(payload.categories).length}개 범주 · ${rows.length}개 대조쌍 · ${2*rows.length}개 지시 후보`;
function store(){try{localStorage.setItem(key,JSON.stringify(reviews))}catch(e){$('#notice').textContent='저장 공간을 사용할 수 없습니다. JSON 내보내기로 보관하세요.'}counts()}
function counts(){const n=rows.filter(r=>(reviews[r.pair_id]?.status||'pending')!=='pending').length;$('#reviewcount').textContent=`검토 상태 지정 ${n} / ${rows.length}`}
function filtered(){const q=$('#search').value.trim().toLowerCase();return rows.filter(r=>(!$('#category').value||r.category===$('#category').value)&&(!$('#verb').value||r.verbs.unsafe===$('#verb').value)&&(!$('#status').value||(reviews[r.pair_id]?.status||'pending')===$('#status').value)&&(!$('#flag').value||r.flags.includes($('#flag').value))&&(!q||JSON.stringify(r).toLowerCase().includes(q)))}
function side(r,which){const data=r[which],e=node('div',undefined,'side '+(which==='unsafe'?'unsafe':''));e.append(node('strong',which==='safe'?'안전 후보':'위험 후보'),node('p',data.instruction_en,'instruction'),node('p',`${data.actor} → ${data.target}`,'muted'));if(r.safe.instruction_en===r.unsafe.instruction_en||['target_state','tool_state','material'].includes(r.pair_axis))e.append(node('p',`장면 조건: ${data.actor_state} / ${data.target_state}`,'context'));const d=node('details');d.append(node('summary','재질·상태 명세'),node('p',`도구/물체 재질: ${data.actor_material}`),node('p',`도구/물체 상태: ${data.actor_state}`),node('p',`대상 상태: ${data.target_state}`));e.append(d);return e}
function render(){const list=filtered(),total=Math.max(1,Math.ceil(list.length/size));page=Math.min(page,total-1);const cards=$('#cards');cards.replaceChildren();for(const r of list.slice(page*size,(page+1)*size)){const card=node('article',undefined,'card');card.dataset.id=r.pair_id;card.append(node('small',r.pair_id+' · '+r.category_ko),node('h2',r.title_ko));const badges=node('div');for(const f of r.flags)badges.append(node('span',flagNames[f]||f,'badge flags'));card.append(badges,node('p','변경 요인: '+r.changed_factor_ko));card.append(node('p','공통 조건: '+(r.shared_context_en||'별도 텍스트 조건 없음 — 아래 관측 증거를 구현해야 합니다.'),'context'));const pair=node('div',undefined,'pair');pair.append(side(r,'safe'),side(r,'unsafe'));card.append(pair,node('p','위해 근거: '+r.rationale_ko),node('p','필요한 관측/조건: '+r.required_evidence_ko),node('p','검토할 점: '+(r.ambiguity_ko||'label 및 장면 구현을 검토해 주세요.')));const d=node('details');d.append(node('summary','분류·중복 정보'),node('p',`family: ${r.family_id} · mechanism: ${r.mechanism_group} · 변화 축: ${r.pair_axis}`),node('p',`작성자 신규성 분류: ${r.novelty} · setup signature: ${r.setup_group}`));card.append(d);const form=node('div',undefined,'review'),label=node('label','검토 상태'),select=node('select');select.className='review-status';for(const [v,t]of Object.entries(statusNames))option(select,v,t);select.value=reviews[r.pair_id]?.status||'pending';select.onchange=()=>{reviews[r.pair_id]={...reviews[r.pair_id],status:select.value,updated:new Date().toISOString()};store()};label.append(select);const nl=node('label','수정할 물체·지시·조건 / 검토 메모'),notes=node('textarea');notes.className='review-notes';notes.value=reviews[r.pair_id]?.notes||'';notes.oninput=()=>{reviews[r.pair_id]={...reviews[r.pair_id],status:select.value,notes:notes.value,updated:new Date().toISOString()};store()};nl.append(notes);form.append(label,nl);card.append(form);cards.append(card)}if(!list.length)cards.append(node('p','조건에 맞는 후보가 없습니다.'));const text=`검색 결과 ${list.length}쌍 · ${page+1}/${total} 페이지`;$('#pageinfo').textContent=text;$('#bottominfo').textContent=text;for(const id of ['prev','prevbottom'])$('#'+id).disabled=page===0;for(const id of ['next','nextbottom'])$('#'+id).disabled=page>=total-1;counts()}
for(const id of ['search','category','verb','status','flag'])$('#'+id).addEventListener(id==='search'?'input':'change',()=>{page=0;render()});
for(const id of ['prev','prevbottom'])$('#'+id).onclick=()=>{page--;render();window.scrollTo(0,0)};
for(const id of ['next','nextbottom'])$('#'+id).onclick=()=>{page++;render();window.scrollTo(0,0)};
$('#export').onclick=()=>{const data={catalog:'semantic_safety_catalog_v3',exported:new Date().toISOString(),reviews};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download='semantic_safety_v3_review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async()=>{try{const d=JSON.parse(await $('#file').files[0].text());if(d.catalog!=='semantic_safety_catalog_v3'||!d.reviews||Array.isArray(d.reviews))throw Error('다른 catalog 형식');let n=0;for(const [id,r]of Object.entries(d.reviews)){if(!byId.has(id)||!Object.hasOwn(statusNames,r.status))continue;reviews[id]={status:r.status,notes:typeof r.notes==='string'?r.notes:'',updated:r.updated||new Date().toISOString()};n++}store();render();$('#notice').textContent=`${n}개 검토 기록을 가져왔습니다.`}catch(e){$('#notice').textContent='가져오기 실패: '+e.message}$('#file').value=''};
render();
</script></html>
