# CPU probes and figures. Versions observed in envs/representation-probe on 2026-11-18.
name: vla-safety-probe
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.14
  - pip=24.0
  - pip:
      - contourpy==1.3.3
      - cycler==0.12.1
      - fonttools==4.68.0
      - h5py==3.14.0
      - joblib==1.5.2
      - kiwisolver==1.5.1
      - matplotlib==3.10.6
      - numpy==1.26.4
      - packaging==26.3
      - pillow==13.0.0
      - pyarrow==20.0.0
      - pyparsing==3.3.3
      - python-dateutil==4.0.0
      - scikit-learn==1.5.2
      - scipy==1.15.3
      - setuptools==79.0.1
      - threadpoolctl==3.6.0
      - tzdata==2026.6
variables:
  PYTHONNOUSERSITE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
