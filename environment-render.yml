# Linux x86_64. Run conda env create from the repository root.
# See environments/README.md for required source patches and verification.
# Original host-only NVIDIA torch 2.10 dev is replaced by CPU torch 2.7.1.
# Policy inference stays in the unchanged training environment via its local socket.
# The evaluator uses the preserved third_party/robosuite_vanilla source.
name: vla-safety-render
channels:
- conda-forge
- nodefaults
dependencies:
- python=3.12.3
- pip=25.1.1
- setuptools=80.9.0
- wheel=0.45.1
- git
- ffmpeg=6.1.1
- libegl
- libgl
- pip:
  - --extra-index-url https://download.pytorch.org/whl/cpu
  - absl-py==2.3.1
  - attrs==25.4.0
  - bddl==1.0.1
  - cloudpickle==3.1.2
  - contourpy==1.3.3
  - cycler==0.12.1
  - easydict==1.14
  - etils==1.15.0
  - fastjsonschema==2.21.2
  - filelock==3.20.1
  - fonttools==4.61.1
  - fsspec==2025.10.0
  - future==1.0.0
  - glfw==2.11.0
  - gym==0.25.2
  - gym-notices==0.1.0
  - h5py==3.16.0
  - imageio==2.38.1
  - iniconfig==2.3.0
  - jinja2==3.1.6
  - jsonschema==4.25.1
  - jsonschema-specifications==2025.9.1
  - jupyter-core==5.9.1
  - jupytext==1.18.1
  - kiwisolver==1.4.9
  - llvmlite==0.46.0
  - markdown-it-py==4.0.0
  - markupsafe==3.0.3
  - matplotlib==3.10.8
  - mdit-py-plugins==0.5.0
  - mdurl==0.1.2
  - mpmath==1.3.0
  - mujoco==3.2.2
  - nbformat==5.10.4
  - networkx==3.6.1
  - numba==0.63.1
  - numpy==1.26.4
  - opencv-python-headless==4.11.0.86
  - packaging==25.0
  - pillow==12.0.0
  - platformdirs==4.5.1
  - pluggy==1.6.0
  - psutil==7.1.3
  - pyopengl==3.1.10
  - pyparsing==3.2.5
  - pytest==8.1.1
  - python-dateutil==2.9.0.post0
  - pyyaml==6.0.3
  - referencing==0.37.0
  - rpds-py==0.30.0
  - scipy==1.16.3
  - six==1.16.0
  - sympy==1.14.0
  - termcolor==3.3.0
  - torch==2.7.1+cpu
  - traitlets==5.14.3
  - typing-extensions==4.15.0
  - zipp==3.23.0
  - -e ./third_party/libero
variables:
  PYTHONNOUSERSITE: '1'
  JAX_PLATFORMS: cpu
  WANDB_MODE: disabled
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MUJOCO_GL: egl
  PYOPENGL_PLATFORM: egl
